<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="余额"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>余额与充值</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142039;background:#f6f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:480px;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 32px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:800}.logo{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:#0f172a;color:#4ade80;font-size:23px}.eyebrow{color:#758199;font-size:12px;letter-spacing:.12em;font-weight:800;text-transform:uppercase}h1{font-size:29px;line-height:1.25;margin:8px 0 20px;letter-spacing:-.04em}.card{background:#fff;border:1px solid #e7ebf2;box-shadow:0 12px 35px #1726420a;border-radius:22px;padding:23px;margin-bottom:16px}.balance{background:#102039;color:white;border:0;padding:25px}.balance .eyebrow{color:#9db0c9}.amount{font-size:48px;font-weight:800;letter-spacing:-.06em;margin:14px 0 8px}.muted{color:#a9b9cf;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.action{width:100%;display:flex;align-items:center;justify-content:space-between;padding:18px 0;background:none;border:0;text-decoration:none;color:#142039;font:inherit;text-align:left}.action+.action{border-top:1px solid #edf0f5}.action strong{display:block;font-size:16px}.action small{display:block;color:#77849b;margin-top:5px;font-size:12px}.arrow{color:#94a3b8;font-size:22px}button,.primary{cursor:pointer}.primary{display:block;width:100%;border:0;border-radius:13px;padding:15px 18px;text-align:center;background:#22c55e;color:#052713;font-weight:800;font-size:16px;text-decoration:none}.secondary{border:0;background:transparent;color:#52627a;font-size:13px}.field{display:block;margin:14px 0 8px;font-size:13px;font-weight:700}.input{width:100%;border:1px solid #d9e0ea;border-radius:12px;padding:14px;font:inherit;outline:0}.input:focus{border-color:#22c55e;box-shadow:0 0 0 3px #22c55e22}.help{font-size:12px;color:#78869a;line-height:1.6}.error{color:#be123c;font-size:13px;min-height:20px}.hidden{display:none!important}.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:24px}a{color:inherit}
</style></head><body><main><header><div class="brand"><span class="logo">$</span><span>余额与充值</span></div><button class="secondary hidden" id="logout">退出登录</button></header><div id="login"><div class="eyebrow">SUBAPI · MOBILE</div><h1>随时查看余额</h1><div class="card"><form id="loginForm"><label class="field" for="email">QQ 邮箱</label><input class="input" id="email" type="email" autocomplete="username" required><label class="field" for="password">原站登录密码</label><input class="input" id="password" type="password" autocomplete="current-password" required><p class="error" id="loginError" role="alert"></p><button class="primary" id="loginButton" type="submit">登录并查看余额</button></form><p class="help">使用绑定原站账号的 QQ 邮箱登录。这里填写原站登录密码，不是 QQ 邮箱密码。密码仅用于向原站登录接口请求，不会保存在这个页面。若账号启用了验证码或两步验证，请先在<a href="https://subapi.elias.kdns.fr/login">原站登录</a>。</p></div></div><div id="dashboard" class="hidden"><div class="eyebrow">ACCOUNT OVERVIEW</div><h1>我的账户</h1><section class="card balance"><div class="row"><span class="eyebrow">可用余额</span><button class="secondary" style="color:#b9c9df" id="refresh">刷新 ↻</button></div><div class="amount" id="amount">—</div><div class="muted" id="updated">正在读取实时数据…</div></section><div class="card"><div class="eyebrow">快捷操作</div><a class="action" href="https://subapi.elias.kdns.fr/purchase" target="_blank" rel="noopener noreferrer"><span><strong>充值余额</strong><small>前往原站选择金额和支付方式</small></span><span class="arrow">›</span></a><a class="action" href="https://subapi.elias.kdns.fr/purchase" target="_blank" rel="noopener noreferrer"><span><strong>订阅套餐</strong><small>查看原站当前可购买选项</small></span><span class="arrow">›</span></a><a class="action" href="https://subapi.elias.kdns.fr/dashboard" target="_blank" rel="noopener noreferrer"><span><strong>完整控制台</strong><small>查看用量和账户详情</small></span><span class="arrow">›</span></a></div><p class="error" id="balanceError" role="alert"></p></div><p class="foot">数据来自 subapi.elias.kdns.fr</p></main><script>
const API='https://subapi.elias.kdns.fr/api/v1';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('subapi_access_token')||'';function show(signedIn){$('login').classList.toggle('hidden',signedIn);$('dashboard').classList.toggle('hidden',!signedIn);$('logout').classList.toggle('hidden',!signedIn)}function unpack(x){if(x&&typeof x==='object'&&'code'in x){if(x.code!==0)throw new Error(x.message||'请求失败');return x.data}return x}async function request(path,options={}){const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})}});let x;try{x=await r.json()}catch{throw new Error('原站暂时没有返回有效数据')}if(!r.ok)throw new Error(x.message||'请求失败（'+r.status+'）');return unpack(x)}async function refresh(){if(!token)return;$('balanceError').textContent='';$('updated').textContent='正在读取实时数据…';try{const profile=await request('/user/profile');const balance=Number(profile?.balance??profile?.user?.balance);if(!Number.isFinite(balance))throw new Error('原站未返回余额');$('amount').textContent='$'+balance.toFixed(2);$('updated').textContent='更新于 '+new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'});}catch(e){$('balanceError').textContent=e.message;if(/unauthorized|登录|token|expired|401/i.test(e.message)){token='';sessionStorage.removeItem('subapi_access_token');show(false)}}}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const btn=$('loginButton');btn.disabled=true;btn.textContent='登录中…';try{const data=await request('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});if(data?.temp_token)throw new Error('此账号需要两步验证，请使用原站登录。');if(!data?.access_token)throw new Error('未获取登录凭证，请使用原站登录。');token=data.access_token;sessionStorage.setItem('subapi_access_token',token);$('password').value='';show(true);await refresh()}catch(err){$('loginError').textContent=err.message}finally{btn.disabled=false;btn.textContent='登录并查看余额'}});$('refresh').addEventListener('click',refresh);$('logout').addEventListener('click',()=>{token='';sessionStorage.removeItem('subapi_access_token');$('amount').textContent='—';show(false)});if(token){show(true);refresh()}else show(false);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
